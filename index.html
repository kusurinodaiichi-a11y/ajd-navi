<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>AJD Navi 新商品・リニューアル品 カタログ</title>
  <link rel="stylesheet" href="css/style.css?v=20260923_2">
  <!-- JsBarcode for rendering real barcodes -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

  <!-- 固定ヘッダー / コントロールバー -->
  <header class="main-header no-print">
    <div class="header-top">
      <div class="header-title">
        <h1>AJD Navi 新商品・リニューアル品 カタログ</h1>
        <span id="period-badge" class="period-badge">対象期間: 2026/07 〜 2026/12</span>
      </div>
      <div class="header-info">
        <span id="update-timestamp" class="timestamp">最終更新: 取得中...</span>
        <button id="btn-print" class="btn btn-print" onclick="window.print()">🖨️ A4カタログ印刷</button>
      </div>
    </div>

    <!-- 検索・フィルター操作バー -->
    <div class="control-panel">
      <!-- 表示モード切替タブ -->
      <div class="view-tabs">
        <button class="tab-btn active" data-view="catalog">🖼️ 画像カタログ</button>
        <button class="tab-btn" data-view="table">📋 改廃表（目次）</button>
      </div>

      <!-- 絞り込みフィルター -->
      <div class="filter-group">
        <!-- 対象期間切り替え -->
        <div class="filter-item">
          <label>📅 期間:</label>
          <select id="period-filter">
            <option value="202607-202612">2026年 7月〜12月</option>
          </select>
        </div>

        <!-- キーワード検索 -->
        <div class="search-box">
          <input type="text" id="search-input" placeholder="🔍 商品名・メーカー名・JANコードで検索...">
          <button id="search-clear" class="btn-clear" title="クリア">×</button>
        </div>

        <!-- グループフィルター -->
        <div class="filter-item">
          <label>区分:</label>
          <select id="group-filter">
            <option value="all">すべて</option>
            <option value="1">■ 医薬品類</option>
            <option value="2">■ その他（医薬品類以外）</option>
          </select>
        </div>

        <!-- 発売月フィルター (動的生成) -->
        <div class="filter-item">
          <label>発売月:</label>
          <select id="month-filter">
            <option value="all">全期間</option>
          </select>
        </div>

        <!-- 区分（新商品/リニューアル/企画品） -->
        <div class="filter-item">
          <label>種別:</label>
          <select id="type-filter">
            <option value="all">すべて</option>
            <option value="新商品">新商品</option>
            <option value="リニューアル品">リニューアル品</option>
            <option value="企画品">企画品</option>
          </select>
        </div>

        <!-- 件数表示 -->
        <div class="result-count">
          該当: <strong id="count-display">0</strong> 件
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツエリア -->
  <main class="main-content">

    <!-- 1. 改廃表（目次）ビュー -->
    <section id="table-view" class="view-section" style="display: none;">
      <div class="section-banner">
        <h2>📋 改廃表（目次一覧）</h2>
        <p class="section-desc">※商品名をクリックすると、該当する画像カタログカードの位置へジャンプします。</p>
      </div>
      <div class="table-container">
        <table class="mokuji-table">
          <thead>
            <tr>
              <th class="col-cat">カテゴリー</th>
              <th class="col-maker">メーカー名</th>
              <th class="col-jan">旧JAN</th>
              <th class="col-name">リニューアル前商品（終売品）</th>
              <th class="col-date">終売日</th>
              <th class="col-sep"></th>
              <th class="col-jan">新JAN</th>
              <th class="col-name">新商品・リニューアル品</th>
              <th class="col-date">発売日</th>
              <th class="col-badge">種別</th>
            </tr>
          </thead>
          <tbody id="mokuji-table-body">
            <!-- JavaScriptで動的生成 -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- 2. 画像カタログ（カード一覧）ビュー -->
    <section id="catalog-view" class="view-section">
      <div id="catalog-container" class="catalog-grid">
        <!-- JavaScriptで動的生成 -->
      </div>
      <div id="no-results" class="no-results" style="display: none;">
        <p>条件に一致する商品が見つかりませんでした。</p>
      </div>
    </section>

  </main>

  <!-- 浮動 TOPへ戻るボタン -->
  <button id="btn-back-to-top" class="btn-back-to-top no-print" title="トップへ戻る">▲ TOP</button>

  <!-- 期間マニフェスト読み込み -->
  <script src="data/periods.js?v=20260923_3"></script>
  <!-- アプリケーションスクリプト -->
  <script src="js/app.js?v=20260923_3"></script>
</body>
</html>
